apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    buildToolsVersion '30.0.3'
    defaultConfig {
        applicationId 'com.gselectroCaqueta.accesoyseguridad'
        minSdkVersion 30
        targetSdkVersion 32
        //multiDexEnabled true
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    productFlavors {
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
repositories {
    google()
    mavenCentral()
    jcenter()
}
dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    // ── CameraX ────────────────────────────────────────────────────────────────
    def camerax_version = "1.2.3"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ── Guava (requerida por CameraX ListenableFuture) ─────────────────────────
    implementation 'com.google.guava:guava:31.1-android'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.google.android.gms:play-services-maps:16.0.0'
    //noinspection GradleCompatible
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation files('libs\\ksoap2-android-assembly-2.6.4-jar-with-dependencies.jar')
    //noinspection GradleCompatible
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation files('libs/zip4j_1.3.2.jar')
    implementation 'com.journeyapps:zxing-android-embedded:3.3.0@aar'
    implementation files('libs/core-3.2.1.jar')
    implementation files('libs/javase-3.2.1.jar')
    implementation files('libs/ScanDecode.jar')

    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
apply plugin: 'realm-android'

